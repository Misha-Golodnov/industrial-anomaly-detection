[project]
name = "industrial-anomaly-detection"
version = "0.1.0"
description = ""
authors = [
    {name = "Misha-Golodnov",email = "mishagolodnovv@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pyreadr (>=0.5.8,<0.6.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
packages = [
    { include = "industrial_novelty", from = "src" }
]

[dependency-groups]
dev = [
    "pre-commit (>=4.7.0,<5.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
